name: Build Fluorite 56.28.2 Original Autostart IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fluorite-keyguard.yml'
      - 'input/Fluorite_8BallPool_56.28.2_2.5.1.ipa.part*'
      - 'input/Fluorite_8BallPool_56.28.2_2.5.1.ipa.parts.json'
      - 'tools/ipa_parts.py'
      - 'tools/repack_fluorite_guarded.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify supplied Fluorite IPA
        run: |
          mkdir -p build/verify dist
          python3 tools/ipa_parts.py join \
            input/Fluorite_8BallPool_56.28.2_2.5.1.ipa.parts.json \
            build/source.ipa
          test "$(shasum -a 256 build/source.ipa | awk '{print $1}')" = \
            "71291c75ad65a3bef6166452b5ef5ecb7fd1ac9378920f5099e5b486441a37f2"
      - name: Repack unsigned with original Fluorite startup intact
        run: |
          python3 tools/repack_fluorite_guarded.py build/source.ipa \
            --output dist/Fluorite_8BallPool_56.28.2_2.5.1_original-autostart_unsigned.ipa
      - name: Verify game, loader, resources and exact size
        run: |
          unzip -t dist/Fluorite_8BallPool_56.28.2_2.5.1_original-autostart_unsigned.ipa
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          source = Path('build/source.ipa')
          output = Path('dist/Fluorite_8BallPool_56.28.2_2.5.1_original-autostart_unsigned.ipa')
          assert source.stat().st_size == output.stat().st_size == 176777963
          with zipfile.ZipFile(source) as a, zipfile.ZipFile(output) as b:
              src_app = next(n[:-len('Info.plist')] for n in a.namelist()
                             if n.startswith('Payload/') and n.count('/') == 2
                             and n.endswith('.app/Info.plist'))
              out_app = next(n[:-len('Info.plist')] for n in b.namelist()
                             if n.startswith('Payload/') and n.count('/') == 2
                             and n.endswith('.app/Info.plist'))
              expected = {
                  'pool': '596e6a8332f4dd6af7b2ec90aa64e3522c20956a6e98b883a9cd04a6ddd2fa77',
                  'Frameworks/libloader.framework/libloader':
                      'a499172a8f61855b26b4811f75e142c27f72c1f119c00594426426bc29d284f8',
                  'fluorite_resources.tar.lz4':
                      'c91abc1b42feb14424e5c2328f950d2373963bcae38bac09e2dd8eb486f99c10',
              }
              for relative, digest in expected.items():
                  left = a.read(src_app + relative)
                  right = b.read(out_app + relative)
                  assert left == right
                  assert hashlib.sha256(right).hexdigest() == digest
                  print(relative, len(right), digest)
              loader = b.read(out_app + 'Frameworks/libloader.framework/libloader')
              assert b'@executable_path/Frameworks/libloader.framework/libloader' in loader
              names = b.namelist()
              assert sum(n.endswith('.app/Frameworks/libloader.framework/libloader') for n in names) == 1
              assert not any('.app/Frameworks/keyguard.framework/' in n for n in names)
              assert not any('.app/Frameworks/fg.framework/' in n for n in names)
              assert b.testzip() is None
          print('source_bytes', source.stat().st_size)
          print('output_bytes', output.stat().st_size)
          PY
          shasum -a 256 dist/Fluorite_8BallPool_56.28.2_2.5.1_original-autostart_unsigned.ipa \
            | tee dist/SHA256SUMS-fluorite-original-autostart.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Fluorite-56.28.2-2.5.1-original-autostart-unsigned-ipa
          path: |
            dist/Fluorite_8BallPool_56.28.2_2.5.1_original-autostart_unsigned.ipa
            dist/SHA256SUMS-fluorite-original-autostart.txt
          if-no-files-found: error
          retention-days: 30
