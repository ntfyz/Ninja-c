name: Build minimal offline IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble source IPA
        run: |
          mkdir -p build/source build/patched dist
          python3 tools/ipa_parts.py join \
            input/Ninja_8BallPool_v56.27.0.ipa.parts.json \
            build/Ninja_8BallPool_v56.27.0.ipa

      - name: Extract and patch original framework binaries
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          ipa = Path("build/Ninja_8BallPool_v56.27.0.ipa")
          with zipfile.ZipFile(ipa) as archive:
              for framework in ("loader", "ninja"):
                  names = [name for name in archive.namelist() if name.endswith(
                      f".app/Frameworks/{framework}.framework/{framework}"
                  )]
                  if len(names) != 1:
                      raise SystemExit(f"Expected one {framework} entry, found: {names}")
                  Path(f"build/source/{framework}").write_bytes(archive.read(names[0]))
          PY
          python3 tools/patch_loader.py \
            build/source/loader \
            build/patched/loader
          python3 tools/patch_ninja.py \
            build/source/ninja \
            build/patched/ninja

      - name: Repack only the patched framework binaries
        run: |
          python3 tools/patch_ipa_minimal.py \
            build/Ninja_8BallPool_v56.27.0.ipa \
            --loader-binary build/patched/loader \
            --ninja-binary build/patched/ninja \
            --output dist/Ninja_8BallPool_v56.27.0_matchfix_offline_1-1_unsigned.ipa

      - name: Verify package and patch bytes
        run: |
          unzip -t dist/Ninja_8BallPool_v56.27.0_matchfix_offline_1-1_unsigned.ipa
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          from tools.patch_loader import (
              APPDOME_WATCHDOG_PATCH, APPDOME_WATCHDOG_RVA,
              GUARD_FAILED_PATCH, GUARD_FAILED_RVA, LOGIN_PATCH, LOGIN_RVA,
              SESSION_VALID_PATCH, SESSION_VALID_RVA,
          )
          from tools.patch_ninja import AUTOPLAY_NOOP_BRANCH, AUTOPLAY_UNAUTHORIZED_BRANCH_RVA

          ipa = Path("dist/Ninja_8BallPool_v56.27.0_matchfix_offline_1-1_unsigned.ipa")
          with zipfile.ZipFile(ipa) as archive:
              loader_name = next(
                  n for n in archive.namelist()
                  if n.endswith(".app/Frameworks/loader.framework/loader")
              )
              ninja_name = next(
                  n for n in archive.namelist()
                  if n.endswith(".app/Frameworks/ninja.framework/ninja")
              )
              loader = archive.read(loader_name)
              ninja = archive.read(ninja_name)
          assert loader[LOGIN_RVA:LOGIN_RVA + len(LOGIN_PATCH)] == LOGIN_PATCH
          assert loader[SESSION_VALID_RVA:SESSION_VALID_RVA + len(SESSION_VALID_PATCH)] == SESSION_VALID_PATCH
          assert loader[GUARD_FAILED_RVA:GUARD_FAILED_RVA + len(GUARD_FAILED_PATCH)] == GUARD_FAILED_PATCH
          assert loader[APPDOME_WATCHDOG_RVA:APPDOME_WATCHDOG_RVA + len(APPDOME_WATCHDOG_PATCH)] == APPDOME_WATCHDOG_PATCH
          assert ninja[AUTOPLAY_UNAUTHORIZED_BRANCH_RVA:AUTOPLAY_UNAUTHORIZED_BRANCH_RVA + 4] == AUTOPLAY_NOOP_BRANCH
          print(f"verified={loader_name},{ninja_name}")
          PY
          sha256sum dist/Ninja_8BallPool_v56.27.0_matchfix_offline_1-1_unsigned.ipa | \
            tee dist/SHA256SUMS.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-matchfix-offline-1-1-unsigned-ipa
          path: |
            dist/Ninja_8BallPool_v56.27.0_matchfix_offline_1-1_unsigned.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
