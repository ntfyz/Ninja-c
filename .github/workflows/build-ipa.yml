name: Build guarded online-key IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source IPA
        run: |
          mkdir -p build/source build/patched build/loader.framework build/guard.framework dist
          python3 tools/ipa_parts.py join input/Ninja_8BallPool_v56.27.0.ipa.parts.json build/source.ipa
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('build/source.ipa') as z:
              for fw in ('loader','ninja'):
                  names=[n for n in z.namelist() if n.endswith(f'.app/Frameworks/{fw}.framework/{fw}')]
                  assert len(names)==1,names
                  Path(f'build/source/{fw}').write_bytes(z.read(names[0]))
          PY
      - name: Preserve original protection guard
        run: |
          python3 tools/patch_loader.py build/source/loader build/guard.framework/guard
          install_name_tool -id @rpath/guard.framework/guard build/guard.framework/guard
          cp ios/GuardInfo.plist build/guard.framework/Info.plist
          chmod 755 build/guard.framework/guard
          otool -D build/guard.framework/guard
      - name: Build online auth loader
        run: |
          xcrun --sdk iphoneos clang++ -arch arm64 -std=c++17 -dynamiclib -fobjc-arc -fblocks \
            -miphoneos-version-min=13.0 \
            '-DLOCAL_AUTH_URL="https://test.ntfyz.xyz/ninja_ios_v2/api/v1/auth/login/"' \
            -install_name @rpath/loader.framework/loader \
            -Wl,-reexport_library,build/guard.framework/guard \
            -framework Foundation -framework Security ios/loader.mm -o build/loader.framework/loader
          cp ios/Info.plist build/loader.framework/Info.plist
          chmod 755 build/loader.framework/loader
          nm -gU build/loader.framework/loader | grep -E '_ninja_loader_(login|device_id|session_valid|logout)$'
          otool -L build/loader.framework/loader | grep '@rpath/guard.framework/guard'
      - name: Patch Ninja and repack
        run: |
          python3 tools/patch_ninja.py build/source/ninja build/patched/ninja
          python3 tools/repack_hybrid_ipa.py build/source.ipa \
            --loader-binary build/loader.framework/loader --loader-plist ios/Info.plist \
            --guard-binary build/guard.framework/guard --guard-plist ios/GuardInfo.plist \
            --ninja-binary build/patched/ninja \
            --output dist/Ninja_8BallPool_v56.27.0_webkey_guarded_v2_unsigned.ipa
      - name: Verify unsigned IPA
        run: |
          unzip -t dist/Ninja_8BallPool_v56.27.0_webkey_guarded_v2_unsigned.ipa
          unzip -l dist/Ninja_8BallPool_v56.27.0_webkey_guarded_v2_unsigned.ipa | grep -E 'Frameworks/(loader|guard|ninja).framework/(loader|guard|ninja)'
          shasum -a 256 dist/Ninja_8BallPool_v56.27.0_webkey_guarded_v2_unsigned.ipa | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ninja-webkey-guarded-v2-unsigned-ipa
          path: |
            dist/Ninja_8BallPool_v56.27.0_webkey_guarded_v2_unsigned.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
